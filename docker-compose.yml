services:
  backend:
    build:
      context: ./backend-django
      dockerfile: Dockerfile
    container_name: estacionamento-backend
    ports:
      - "8080:8080"
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: estacionamento-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite_data:
